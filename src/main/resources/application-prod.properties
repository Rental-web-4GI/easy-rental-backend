# ==============================================================
# Profil PROD — bascule kernel (mêmes binaires que local)
# Secrets via vault / env : KERNEL_*, JWT_SECRET, spring.mail.*, PLATFORM_*
# ==============================================================

server.port=${PORT:8081}
server.max-http-request-header-size=65536
spring.application.name=easyrental

# JWT — 45 minutes (filet absolu ; idle FE = 40 min)
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:2700000}

# Kernel
kernel.integration.enabled=${KERNEL_INTEGRATION_ENABLED:true}
kernel.base-url=${KERNEL_BASE_URL:https://kernel-core.yowyob.com}
kernel.client-id=${KERNEL_CLIENT_ID}
kernel.api-key=${KERNEL_API_KEY}
kernel.tenant-id=${KERNEL_TENANT_ID}
kernel.jwks-uri=${KERNEL_JWKS_URI:}
kernel.connect-timeout-ms=${KERNEL_CONNECT_TIMEOUT_MS:15000}
kernel.read-timeout-ms=${KERNEL_READ_TIMEOUT_MS:90000}

# Hybrid flags — prod
easy-rental.staff.skip-kernel-provisioning=false
easy-rental.staff.skip-email-verification=true
easy-rental.client.skip-kernel-auth=false
easy-rental.org.require-email-verification=true
easy-rental.vehicle.allow-local-fallback=false
easy-rental.mail.enabled=true
easy-rental.mail.from=${EASY_RENTAL_MAIL_FROM:noreply@easyrental.app}
easy-rental.seed.enabled=false
easy-rental.admin.bootstrap-enabled=false
kernel.file-core.enabled=${KERNEL_FILE_CORE_ENABLED:false}
easy-rental.kafka.kernel-events.enabled=${EASY_RENTAL_KAFKA_KERNEL_EVENTS:false}
easy-rental.audit.kernel-sync.enabled=${EASY_RENTAL_AUDIT_KERNEL_SYNC:false}

easy-rental.agency.login-url=${EASY_RENTAL_AGENCY_LOGIN_URL}
easy-rental.support.admin-email=${SUPPORT_ADMIN_EMAIL}
easy-rental.support.console-url=${SUPPORT_CONSOLE_URL}
easy-rental.support.help-url=${SUPPORT_HELP_URL}

application.base-url=${APPLICATION_BASE_URL}
application.file.upload-dir=${UPLOAD_DIR:uploads}
application.file.max-upload-bytes=16777216

