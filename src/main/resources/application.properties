# ==============================================================
# Server port
# ==============================================================
server.port=8081
server.max-http-request-header-size=65536

spring.application.name=easyrental

spring.data.redis.host=${SPRING_DATA_REDIS_HOST:localhost}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:6379}
spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.elasticsearch.uris=${SPRING_ELASTICSEARCH_URIS:http://localhost:9200}

# ==============================================================
# Configuration R2DBC (Réactif - Pour l'application)
# ==============================================================

# -----------------------------------------------------
# Config pour PostgreSQL Local
# -----------------------------------------------------
spring.r2dbc.url=r2dbc:postgresql://localhost:5433/easyrental
spring.r2dbc.username=easyrental
spring.r2dbc.password=easyrental123
spring.r2dbc.properties.ssl=false
spring.r2dbc.pool.enabled=true
spring.r2dbc.pool.initial-size=1
spring.r2dbc.pool.max-size=5
spring.r2dbc.pool.max-idle-time=30s
spring.r2dbc.pool.validation-query=SELECT 1


# ==============================================================
# Configuration Liquibase (JDBC - Pour la migration au démarrage)
# ==============================================================
spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml

# ------------------------------------------------------
# config pour PostgreSQL Local
# ------------------------------------------------------
spring.liquibase.url=jdbc:postgresql://localhost:5433/easyrental
spring.liquibase.user=easyrental
spring.liquibase.password=easyrental123
spring.liquibase.driver-class-name=org.postgresql.Driver


# ==============================================================
# Configuration Swagger (SpringDoc)
# ==============================================================
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html

# ==============================================================
# Configuration WebFlux
# ==============================================================
spring.webflux.base-path=/
spring.codec.max-in-memory-size=16MB

# ==============================================================
# Kernel-core integration (P0)
# ==============================================================
kernel.integration.enabled=${KERNEL_INTEGRATION_ENABLED:false}
kernel.base-url=${KERNEL_BASE_URL:https://kernel-core.yowyob.com}
kernel.client-id=${KERNEL_CLIENT_ID:}
kernel.api-key=${KERNEL_API_KEY:}
kernel.tenant-id=${KERNEL_TENANT_ID:11111111-1111-1111-1111-111111111111}
kernel.jwks-uri=${KERNEL_JWKS_URI:}

# Clé secrète (générez-en une forte pour la prod via la variable JWT_SECRET)
jwt.secret=${JWT_SECRET:7KyhCtwGUvIoqcxTCabQGm3FJ/F6LfCy9nmOg3hy+WA=}
# Absolute JWT TTL (45 min). Idle logout (~40 min) is enforced on the frontend.
jwt.expiration=${JWT_EXPIRATION:2700000}

# Hybrid kernel defaults (overridden per profile)
easy-rental.staff.skip-kernel-provisioning=false
easy-rental.staff.skip-email-verification=true
easy-rental.client.skip-kernel-auth=false
easy-rental.org.require-email-verification=false
easy-rental.vehicle.allow-local-fallback=true
easy-rental.mail.enabled=false
easy-rental.mail.from=noreply@easyrental.local
kernel.file-core.enabled=false
easy-rental.kafka.kernel-events.enabled=false
easy-rental.audit.kernel-sync.enabled=false
easy-rental.driver.kernel-hybrid.enabled=false

# ==============================================================
# Configuration MEDIA
# ==============================================================
easy-rental.support.admin-email=${SUPPORT_ADMIN_EMAIL:rentalreseau01@gmail.com}
easy-rental.support.console-url=${SUPPORT_CONSOLE_URL:http://localhost:3004/admin}
easy-rental.support.help-url=${SUPPORT_HELP_URL:http://localhost:3000/help}
easy-rental.admin.bootstrap-enabled=false
easy-rental.admin.email=${PLATFORM_ADMIN_EMAIL:}
easy-rental.admin.password=${PLATFORM_ADMIN_PASSWORD:password123}

application.file.upload-dir=uploads
# Max size per uploaded file (bytes) — PDF scans / photos chauffeur
application.file.max-upload-bytes=16777216
# URL de base pour construire le lien public
# application.base-url=http://localhost:8081
application.base-url=https://apirental5gi-v2.onrender.com
